name: Check DeFiLlama revenue
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/check_defillama_feed.py"
      - ".github/workflows/check-defillama.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_defillama_feed.py
