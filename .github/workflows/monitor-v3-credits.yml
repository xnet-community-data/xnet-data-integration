name: Monitor Dune credits
on:
  schedule:
    - cron: "10 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/v3_credit_usage.py"
      - ".github/workflows/monitor-v3-credits.yml"
permissions:
  contents: write
concurrency:
  group: xnet-live-state
  queue: max
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Read account usage and preserve history
        env:
          GH_TOKEN: ${{ github.token }}
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          python scripts/v3_hydrate_live_state.py
          python scripts/v3_credit_usage.py
          bash scripts/v3_publish_live_state.sh --credit-usage-only
