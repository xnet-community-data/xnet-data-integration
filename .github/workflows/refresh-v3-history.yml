name: Refresh XNET V3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-v3-history.yml"
      - "scripts/v3_refresh_dashboard.py"
      - "scripts/v3_transfer_instruction_recovery.py"
      - "scripts/v3_rpc_transfer_proof.py"
      - "scripts/v3_autonomous_reconcile.py"
      - "scripts/v3_additive_day.py"
      - "scripts/v3_autonomy_watchdog.py"
      - "scripts/v3_indexer_lag.py"
      - "scripts/v3_holder_seed_review.py"
      - "scripts/v3_result_cache.py"
      - "scripts/v3_standing_budget.py"
      - "scripts/v3_autonomous_estimates.py"
      - "scripts/v3_dune_metadata.py"
      - "scripts/v3_execution_tracker.py"
      - "scripts/v3_publish_live_state.sh"
      - "scripts/v3_hydrate_live_state.py"
      - "scripts/v3_live_state_store.py"
      - "scripts/v3_sync_network.py"
      - "scripts/v3_reduce_chain.py"
      - "scripts/v3_build_chain_snapshot.py"
      - "scripts/v3_build_live_bundle.py"
      - "config/v3_refresh.json"
      - "config/v3_pipeline.json"
      - "scripts/v3_build_revenue_state.py"
      - "scripts/v3_build_presentation_history.py"
      - "dune/v3/sql/60_live_current_snapshot.sql"
      - "dune/v3/sql/71_commercial_history.sql"
      - "dune/v3/sql/62_bbb_dex_hot.sql"
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      resume:
        description: "Clear a reviewed spend/failure pause"
        type: boolean
        default: false
      cached_only:
        description: "Publish independent API/cache data without any Dune execution or export"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: xnet-live-state
  queue: max
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restore production state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          python scripts/v3_hydrate_live_state.py
      - name: Refresh bounded sources and cached charts
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          RESUME: ${{ inputs.resume }}
          # Deployments must never silently submit paid verification work.
          CACHED_ONLY: ${{ github.event_name == 'push' || inputs.cached_only }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$CACHED_ONLY" = "true" ]; then
            python scripts/v3_refresh_dashboard.py --cached-only
          elif [ "$RESUME" = "true" ]; then
            python scripts/v3_refresh_dashboard.py --resume
          else
            python scripts/v3_refresh_dashboard.py
          fi
      - name: Verify actual autonomy health
        if: always()
        run: python scripts/v3_autonomy_watchdog.py
      - name: Preserve diagnostic state
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xnet-v3-refresh-state
          path: |
            data/current/v3_refresh_state.json
            .git/xnet-live-state/receipt.json
            .git/xnet-live-state/pending.json
            data/current/v3_operational_health.json
            state/v3_credit_benchmark.json
            state/v3_autonomy_audit.json
          retention-days: 14
          include-hidden-files: true
