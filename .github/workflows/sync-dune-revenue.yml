name: Sync XNET revenue to Dune

on:
  schedule:
    # Independent from the revenue-source job. The source mirror runs at
    # 21:15 UTC; this consumes the latest successfully published main state at
    # 21:30 UTC. If the source job fails, Dune keeps last-good data instead of
    # inheriting that failure.
    - cron: "30 21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-dune-revenue.yml"
      - "scripts/v3_build_revenue_state.py"
      - "scripts/v3_build_live_bundle.py"
      - "scripts/v3_publish_live_state.sh"
      - "scripts/v3_hydrate_live_state.py"
      - "scripts/v3_live_state_store.py"
      - "scripts/v3_sync_dynamic_counter_labels.py"
      - "config/v3_headline_visual_ids.json"

permissions:
  contents: write

# Only Dune state writers share this lock. The revenue/DeFiLlama writer uses
# a different lock and schedule so neither pipeline can cascade-fail the other.
concurrency:
  group: xnet-live-state
  queue: max
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the latest published revenue source
        uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restore dashboard state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          python scripts/v3_hydrate_live_state.py
      - name: Build Dune revenue state from the published feed
        run: python scripts/v3_build_revenue_state.py
      - name: Queue affected charts when accepted source contents change
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          journal = Path("data/current/v3_refresh_state.json")
          state = json.loads(journal.read_text())
          source = json.loads(Path("data/current/xnet_revenue_state.json").read_text())["source"]
          digest = source.get("sheet_sha256")
          previous = state.get("external_sources", {}).get("revenue", {})
          if digest and digest != previous.get("source_sha256"):
              state["forced_presentations"] = sorted(set(state.get("forced_presentations", [])) | {"current", "commercial"})
          if digest:
              state.setdefault("external_sources", {})["revenue"] = {
                  "source_sha256": digest,
                  "source_fetched_at_utc": source.get("sheet_fetched_at_utc"),
              }
          journal.write_text(json.dumps(state, indent=2) + "\n")
          PY
      - name: Rebuild atomic LiveFetch bundle
        run: python scripts/v3_build_live_bundle.py
      - name: Publish Dune revenue state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          bash scripts/v3_publish_live_state.sh
      - name: Install checksum-pinned Dune CLI
        # Pin the exact release already verified by production, rather than
        # executing a mutable upstream installer beside the Dune credential.
        run: |
          test "$(uname -m)" = "x86_64"
          archive="$RUNNER_TEMP/dune-cli-0.1.18-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 2 --max-time 120 \
            --proto '=https' --tlsv1.2 \
            https://github.com/duneanalytics/cli/releases/download/v0.1.18/dune-cli_0.1.18_linux_amd64.tar.gz \
            -o "$archive"
          echo "1b60f0df45e8d1827ba8ec9c85217ab2357ac2c3fc5a5b0e9738e7827c926dd9  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/dune-verified"
          tar -xzf "$archive" -C "$RUNNER_TEMP/dune-verified" dune
          chmod +x "$RUNNER_TEMP/dune-verified/dune"
          "$RUNNER_TEMP/dune-verified/dune" --version
          echo "$RUNNER_TEMP/dune-verified" >> "$GITHUB_PATH"
      - name: Sync dynamic Dune revenue labels
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        run: |
          if [ -z "${DUNE_API_KEY:-}" ]; then
            echo "::warning::DUNE_API_KEY is not configured; Dune labels were not updated."
            exit 0
          fi
          python scripts/v3_sync_dynamic_counter_labels.py
