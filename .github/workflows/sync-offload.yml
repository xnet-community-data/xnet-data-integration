name: Sync XNET Offload

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch XNET offload data
        run: python scripts/sync_offload.py

      - name: Commit updated mirror
        run: |
          git config user.name "XNET Community Data"
          git config user.email "335743616+xnet-community-data@users.noreply.github.com"
          git add data/xnet_offload_api.json

          if git diff --cached --quiet; then
            echo "No offload-data changes"
            exit 0
          fi

          git commit -m "data: refresh XNET offload mirror"
          git push
