name: Sync XNET revenue data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-revenue.yml"
      - "scripts/sync_revenue.py"
      - "scripts/build_defillama_revenue.py"
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xnet-revenue-feed
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git
        run: |
          git config user.name "xnet-data-bot"
          git config user.email "xnet-data-bot@users.noreply.github.com"

      - name: Fetch and normalize revenue sheet
        run: python scripts/sync_revenue.py

      - name: Build DeFiLlama revenue feed
        run: python scripts/build_defillama_revenue.py

      - name: Commit changed revenue source and derived state
        shell: bash
        run: |
          # Publish derived feed changes even when the Google Sheet is unchanged.
          # Skip timestamp-only current-state updates on main.
          if git diff --quiet -- \
            data/xnet_revenue_sheet_raw.csv \
            data/xnet_revenue_monthly.json \
            data/xnet_defillama_revenue.json
          then
            echo "Revenue source and public feed unchanged."
            exit 0
          fi

          git add \
            data/xnet_revenue_sheet_raw.csv \
            data/xnet_revenue_monthly.json \
            data/xnet_defillama_revenue.json

          git diff --cached --check

          git commit -m "Update XNET revenue data"
          git push origin main

      - name: Check published feed and DeFiLlama ingestion
        run: python scripts/check_defillama_feed.py

