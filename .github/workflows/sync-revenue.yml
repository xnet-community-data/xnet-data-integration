name: Sync XNET revenue data

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xnet-live-state
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git
        run: |
          git config user.name "xnet-data-bot"
          git config user.email "xnet-data-bot@users.noreply.github.com"

      - name: Restore production state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          python scripts/v3_hydrate_live_state.py

      - name: Fetch and normalize revenue sheet
        run: python scripts/sync_revenue.py

      - name: Detect source changes
        id: source
        shell: bash
        run: |
          if git diff --quiet -- \
            data/xnet_revenue_sheet_raw.csv \
            data/xnet_revenue_monthly.json
          then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Revenue source unchanged."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Revenue source changed."
          fi

      - name: Build derived revenue state
        run: |
          python scripts/build_defillama_revenue.py
          python scripts/v3_build_revenue_state.py

      - name: Publish current revenue state to live-state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          bash scripts/v3_publish_live_state.sh

      - name: Sync dynamic Dune revenue labels
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        shell: bash
        run: |
          if [ -z "${DUNE_API_KEY:-}" ]; then
            echo "DUNE_API_KEY GitHub secret is not configured."
            echo "Skipping Dune label sync."
            exit 0
          fi

          curl -sSfL \
            https://github.com/duneanalytics/cli/raw/main/install.sh \
            | bash

          export PATH="$HOME/.local/bin:$PATH"

          python scripts/v3_sync_dynamic_counter_labels.py

      - name: Commit changed revenue source and derived state
        if: steps.source.outputs.changed == 'true'
        shell: bash
        run: |
          git add \
            data/xnet_revenue_sheet_raw.csv \
            data/xnet_revenue_monthly.json \
            data/xnet_defillama_revenue.json \
            data/current/xnet_revenue_state.json

          git diff --cached --check

          git commit -m "Update XNET revenue data"
          git push origin main
