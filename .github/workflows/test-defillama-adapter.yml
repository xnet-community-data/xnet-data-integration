name: Test XNET DeFiLlama adapter

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-defillama-adapter.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out proposed XNET adapter
        uses: actions/checkout@v5
        with:
          repository: xnet-community-data/dimension-adapters
          ref: xnet-defillama-final-20261005
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: "10"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install upstream dependencies
        run: pnpm install --frozen-lockfile

      - name: Test historical, projected and live daily accrual
        env:
          DEBUG_BREAKDOWN_FEES: "true"
        run: |
          # The CLI date is the end of the requested window, so each command
          # reproduces the previous calendar day's daily accrual.
          npm test fees xnet 2025-03-01
          npm test fees xnet 2026-05-16
          # Exercises XIP-13.1 fiat accounting on 2026-08-31.
          npm test fees xnet 2026-09-01
          # Exercises official projected September accrual.
          npm test fees xnet 2026-09-29
          npm test fees xnet 2026-10-05

      - name: Check adapter types
        run: npm run ts-check

      - name: Check CLI types
        run: npm run ts-check-cli
