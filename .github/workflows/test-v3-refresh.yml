name: Test Dune refresh recovery

on:
  push:
    branches: [main]
    paths:
      - "scripts/v3_*.py"
      - "tests/test_v3_*.py"
      - "scripts/sync_revenue.py"
      - "tests/test_sync_revenue_epoch.py"
      - "scripts/v3_refresh_dashboard.py"
      - "scripts/v3_reduce_chain.py"
      - "scripts/v3_sync_network.py"
      - "scripts/v3_execution_tracker.py"
      - "scripts/v3_publish_live_state.sh"
      - "scripts/v3_hydrate_live_state.py"
      - "scripts/v3_live_state_store.py"
      - "tests/test_v3_live_state_store.py"
      - "scripts/v3_build_live_bundle.py"
      - "dune/v3/sql/60_live_current_snapshot.sql"
      - "config/v3_refresh.json"
      - "tests/test_v3_refresh.py"
      - "tests/test_v3_holder_integrity.py"
      - "tests/test_v3_network_published_state.py"
      - "tests/test_v3_live_bundle.py"
      - "tests/test_v3_reconciliation.py"
      - "tests/test_v3_execution_tracker.py"
      - ".github/workflows/test-v3-refresh.yml"
  pull_request:
    paths:
      - "scripts/v3_*.py"
      - "tests/test_v3_*.py"
      - "scripts/sync_revenue.py"
      - "tests/test_sync_revenue_epoch.py"
      - "scripts/v3_refresh_dashboard.py"
      - "scripts/v3_reduce_chain.py"
      - "scripts/v3_sync_network.py"
      - "scripts/v3_execution_tracker.py"
      - "scripts/v3_publish_live_state.sh"
      - "scripts/v3_hydrate_live_state.py"
      - "scripts/v3_live_state_store.py"
      - "tests/test_v3_live_state_store.py"
      - "scripts/v3_build_live_bundle.py"
      - "dune/v3/sql/60_live_current_snapshot.sql"
      - "config/v3_refresh.json"
      - "tests/test_v3_refresh.py"
      - "tests/test_v3_holder_integrity.py"
      - "tests/test_v3_network_published_state.py"
      - "tests/test_v3_live_bundle.py"
      - "tests/test_v3_reconciliation.py"
      - "tests/test_v3_execution_tracker.py"
      - ".github/workflows/test-v3-refresh.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test complete offline regression and fault-injection suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check publisher syntax
        run: bash -n scripts/v3_publish_live_state.sh
